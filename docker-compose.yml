version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: avalon-mysql
    restart: always
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-avalon_root_2024}
      MYSQL_DATABASE: avalon_db
      MYSQL_USER: avalon_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-avalon_pass_2024}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --log-bin-trust-function-creators=1
      - --performance-schema=OFF
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./mysql/DDL.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "avalon_user", "-p${MYSQL_PASSWORD:-avalon_pass_2024}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - avalon-net

  avalon-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: avalon-server:prod
    container_name: avalon-server
    restart: always
    ports:
      - "8082:8082"
    environment:
      PORT: 8082
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: avalon_user
      DB_PASS: ${MYSQL_PASSWORD:-avalon_pass_2024}
      DB_NAME: avalon_db
      DB_POOL_MAX: 10
      DB_POOL_MIN: 2
      NODE_ENV: production
      HTTPS: "true"
      SSL_CERT_PATH: /app/ssl/haoyu-wang141.top_nginx/haoyu-wang141.top_bundle.pem
      SSL_KEY_PATH: /app/ssl/haoyu-wang141.top_nginx/haoyu-wang141.top.key
      WX_APPID: wxb021f21838eb4ced
      WX_SECRET: ${WX_SECRET}
    volumes:
      - ../ssl:/app/ssl:ro
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - avalon-net

networks:
  avalon-net:
    name: avalon-net
    driver: bridge
