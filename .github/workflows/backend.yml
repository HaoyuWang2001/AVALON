name: backend

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'mysql/**'
      - 'docker-compose.yml'
      - 'scripts/test-backend.sh'
      - 'scripts/deploy-backend.sh'

jobs:
  test:
    runs-on: self-hosted
    steps:
      - name: 同步仓库
        run: |
          cd /home/lighthouse/AVALON/AVALON
          for i in 1 2 3 4 5; do
            git fetch --all --prune && break
            echo "git fetch 失败(TLS中断)，重试 $i/5"
            sleep 8
          done
          git reset --hard origin/main
      - name: 后端测试
        run: cd /home/lighthouse/AVALON/AVALON && bash scripts/test-backend.sh all

  deploy:
    needs: test
    runs-on: self-hosted
    steps:
      - name: 同步仓库
        run: |
          cd /home/lighthouse/AVALON/AVALON
          for i in 1 2 3 4 5; do
            git fetch --all --prune && break
            echo "git fetch 失败(TLS中断)，重试 $i/5"
            sleep 8
          done
          git reset --hard origin/main
      - name: 部署后端
        run: cd /home/lighthouse/AVALON/AVALON && docker compose up -d --build avalon-server
