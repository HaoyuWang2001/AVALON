name: frontend

# 仅手动触发（不再随前端 push 自动生成预览码）。
# 需要真机预览时：GitHub → Actions → frontend → Run workflow。
on:
  workflow_dispatch:

jobs:
  preview:
    runs-on: self-hosted
    steps:
      - name: 同步仓库
        run: |
          cd /home/lighthouse/AVALON/AVALON
          for i in 1 2 3 4 5; do
            git fetch --all --prune && break
            echo "git fetch 失败(TLS中断)，重试 $i/5"
            sleep 8
          done
          git reset --hard origin/main
      - name: 前端预览
        run: cd /home/lighthouse/AVALON/AVALON && bash scripts/preview-on-server.sh
